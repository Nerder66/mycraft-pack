[native_behavior]
	#Allow the native ice breath's temporary surface-water freezing. Original Mowzie casts are unaffected.
	freeze_surface_water = true
	#Apply the native Solar Beam player's Slowness III to the actual emitting player. Mobs receive no added restriction.
	solar_player_slowness = true
	#Apply Solar Flare/Supernova preparation slowness to the actual player emitter.
	solar_pulse_player_slowness = true
