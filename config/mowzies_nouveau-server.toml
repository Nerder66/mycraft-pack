[channels]
	# Default: 60
	# Range: 0 ~ 1000000
	solar_beam_per_second = 60
	# Default: 20
	# Range: 0 ~ 1000000
	ice_breath_per_second = 20
	# Default: 20
	# Range: 0 ~ 1000000
	tunnel_per_second = 20
	#Active duration ticks added per Extend Time.
	# Default: 20
	# Range: 0 ~ 72000
	extend_ticks = 20
	# Default: 200
	# Range: 1 ~ 72000
	maximum_active_ticks = 200

[geomancy]
	#Payload mana per Geomantic Mass. Sizes follow the native gauntlet tiers, capped at Huge.
	# Default: 20
	# Range: 0 ~ 1000000
	per_mass = 20
	#Maximum height of one pillar. Growth stops at solid ceilings.
	# Default: 8
	# Range: 1 ~ 64
	pillar_height = 8
	#Maximum lifetime of a floating boulder or pillar in ticks.
	# Default: 1200
	# Range: 20 ~ 72000
	maximum_lifetime_ticks = 1200

[acid]
	#Maximum poison duration in ticks for acid glyphs, including Extend Time.
	# Default: 1200
	# Range: 80 ~ 72000
	maximum_poison_ticks = 1200

[paws]
	#Base curse radius; native paws use ten blocks.
	# Default: 10.0
	# Range: 0.1 ~ 64.0
	radius = 10.0
	#Maximum radius including one block per AoE augment.
	# Default: 24.0
	# Range: 0.1 ~ 64.0
	maximum_radius = 24.0
	#Maximum duration in ticks. Base duration follows the native Elokosa Paw configuration.
	# Default: 1200
	# Range: 1 ~ 72000
	maximum_duration_ticks = 1200
	#Highest zero-based curse amplifier. Eclipse has no strength scaling.
	# Default: 3
	# Range: 0 ~ 10
	maximum_amplifier = 3

