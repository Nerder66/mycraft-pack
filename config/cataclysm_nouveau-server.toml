[bolt_strike]
	#Addon balance value for native bolt entity base damage.
	# Default: 16.0
	# Range: 0.0 ~ 100000.0
	damage = 16.0
	#Native warmup ticks; damage follows 12 ticks later.
	# Default: 34
	# Range: 0 ~ 1200
	warmup_ticks = 34

[void_rune]
	#Damage per native hit. -1 follows Cataclysm's own ability configuration.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	damage = -1.0
	#Initial delay; native attack animation then proceeds normally.
	# Default: 10
	# Range: 0 ~ 1200
	warmup_ticks = 10

[flame_jet]
	#Damage per native hit. -1 follows Cataclysm's own ability configuration.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	damage = -1.0
	#Initial delay; native attack animation then proceeds normally.
	# Default: 10
	# Range: 0 ~ 1200
	warmup_ticks = 10

[ceraunus]
	#-1 uses Ceraunus weapon attack damage plus the player's native base 1, without caster melee gear scaling.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	damage = -1.0

[wave]
	#Default 9 matches Scylla's base wave damage. -1 follows the Ceraunus weapon wave configuration.
	# Default: 9.0
	# Range: -1.0 ~ 100000.0
	damage = 9.0
	#Native wave lifespan for one-shot carriers before Extend Time (+50% per modifier); repeating carriers follow their own lifespan.
	# Default: 80
	# Range: 40 ~ 1200
	lifetime_ticks = 80

[flare_bomb]
	#Direct native hit damage; Harm amplification also applies to the generated jets.
	# Default: 7.0
	# Range: 0.0 ~ 100000.0
	direct_damage = 7.0
	#Damage per generated jet; each impact creates the native four-arm pattern, up to 40 jets.
	# Default: 7.0
	# Range: 0.0 ~ 100000.0
	jet_damage = 7.0

[monstrosity]
	#Native Boss quake centered at the resolved location.
	# Default: 6.25
	# Range: 1.0 ~ 32.0
	quake_radius = 6.25
	#Healing per absorption wave that actually removes lava. There are three native waves.
	# Default: 15.0
	# Range: 0.0 ~ 100000.0
	absorption_heal = 15.0
	#Horizontal blocks per tick during the collision-limited shoulder charge.
	# Default: 0.75
	# Range: 0.1 ~ 2.0
	charge_speed = 0.75
	#Lifetime of each native grounded lava bomb; managed sources cannot spread.
	# Default: 200
	# Range: 1 ~ 1200
	lava_lifetime_ticks = 200

[bone_fracture]
	#Base duration of the native fracture effect, before duration augments.
	# Default: 100
	# Range: 2 ~ 1200
	duration_ticks = 100

[lava_walking]
	#Base duration of lava surface walking and lava/burning protection; crouching allows diving.
	# Default: 600
	# Range: 2 ~ 1200
	duration_ticks = 600

[scylla]
	#Direct damage for both native spears; -1 follows Scylla SpearDamage.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	spear_damage = -1.0
	#Base damage per lightning strike; -1 follows Scylla LightningStormDamage.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	storm_damage = -1.0
	#Damage per native electric-field hit; -1 follows Scylla LightningAreaDamage.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	field_damage = -1.0
	#Damage per serpent strike; -1 follows Scylla SnakeDamage.
	# Default: -1.0
	# Range: -1.0 ~ 100000.0
	serpent_damage = -1.0
	#Maximum-health fraction added by lightning storms; -1 follows Scylla StormHpDamage.
	# Default: -1.0
	# Range: -1.0 ~ 1.0
	storm_health_fraction = -1.0
	#Initial delay for the standalone storm, before its native strike animation.
	# Default: 10
	# Range: 0 ~ 1200
	storm_delay_ticks = 10
	#Standalone electric field duration before duration augments; radius shrinks across this interval.
	# Default: 160
	# Range: 20 ~ 1200
	field_duration_ticks = 160
	#Cloud formation delay before native water/lightning spear rain. Default shortens the Boss windup; use 115 for native timing.
	# Default: 40
	# Range: 0 ~ 1200
	cloud_warmup_ticks = 40
	#Sight distance of the action hook, re-sampled when the anchor launches; never loads chunks.
	# Default: 64
	# Range: 4 ~ 128
	anchor_range = 64
	#Blocks per tick for the collision-limited anchor plunge pull.
	# Default: 2.0
	# Range: 0.1 ~ 3.0
	anchor_pull_speed = 2.0
	#Water surface walking duration before time augments.
	# Default: 600
	# Range: 2 ~ 1200
	water_walking_duration_ticks = 600

[harbinger]
	#Allow managed laser impacts to place fire; entity ignition still follows native behavior. No glass destruction or EMP reset.
	terrain_fire = false
	#Loaded, visible target ray for native homing launches.
	# Default: 48
	# Range: 4 ~ 128
	homing_range = 48

[ignis]
	#Allow native Ignis explosions to leave terrain fire; block destruction remains disabled.
	terrain_fire = false

[ender_guardian]
	#Maximum target distance for Guardian actor actions; never loads extra chunks.
	# Default: 32
	# Range: 4 ~ 128
	action_target_range = 32
	#Preparation ticks before the bullet leaves its staging position. Special Ars trajectories keep their own motion.
	# Default: 30
	# Range: 1 ~ 200
	bullet_preparation_ticks = 30
	#Native vortex lifespan before duration augments; collapse explodes without terrain damage.
	# Default: 300
	# Range: 40 ~ 1200
	vortex_lifetime_ticks = 300

[maledictus]
	#Ticks before losing one rage level; gaining rage refreshes this interval. Maximum five levels.
	# Default: 200
	# Range: 1 ~ 72000
	rage_decay_ticks = 200
	#Rage levels gained by the active glyph before potency augments.
	# Default: 1
	# Range: 1 ~ 5
	rage_stacks_per_cast = 1
	#Initial ground-halberd delay before its native animation and damage window.
	# Default: 10
	# Range: 0 ~ 1200
	halberd_warmup_ticks = 10

[ancient_remnant]
	#Base lifetime of the three native Boss storms, before duration augments.
	# Default: 300
	# Range: 20 ~ 1200
	storm_lifetime_ticks = 300

