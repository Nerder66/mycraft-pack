[damage]
	#Cap otherwise uncapped target maximum-health damage at the fixed damage of the same hit, before augments and Ars scaling. Only addon casts; false preserves native formulas and existing native caps.
	cap_health_damage = true

[damage_augments]
	#Base native hit fraction per Amplify/Dampen, before Ars equipment scaling. Each hit segment uses its own unaugmented base.
	# Default: 0.2
	# Range: 0.0 ~ 1.0
	fraction = 0.2
	# Default: 2.0
	# Range: 0.0 ~ 100000.0
	minimum = 2.0
	# Default: 10.0
	# Range: 0.0 ~ 100000.0
	maximum = 10.0
